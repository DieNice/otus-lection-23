[project]
name = "user-auth-service"
version = "0.1.0"
description = ""
authors = [
    {name = "DieNice"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0"

dependencies = [
    "fastapi (>=0.135.3,<0.136.0)",
    "uvicorn (>=0.44.0,<0.45.0)",
    "loguru (>=0.7.3,<0.8.0)",
    "graypy (>=2.1.0,<3.0.0)",
    "pydantic-settings (>=2.13.1,<3.0.0)",
    "alembic (>=1.18.4,<2.0.0)",
    "sqlalchemy (>=2.0.50,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "psycopg2-binary (>=2.9.12,<3.0.0)",
    "prometheus-client (>=0.25.0,<0.26.0)",
    "locust (>=2.44.4,<3.0.0)",
    "passlib (==1.7.4)",
    "python-jose (>=3.5.0,<4.0.0)",
    "pydantic[email] (>=2.13.4,<3.0.0)",
    "python-multipart (>=0.0.32,<0.0.33)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[dependency-groups]
test = [
    "pytest (>=9.0.2,<10.0.0)"
]
dev = [
    "ruff (>=0.15.9,<0.16.0)",
    "mypy (>=1.20.0,<2.0.0)"
]
