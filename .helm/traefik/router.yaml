apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: router
  namespace: default
spec:
  entryPoints:
    - web
  routes:
    - match: PathPrefix(`/docs`)
      kind: Rule
      services:
        - name: auth-service
          port: 80
    - match: PathPrefix(`/user`)
      kind: Rule
      services:
        - name: auth-service
          port: 80
    - match: PathPrefix(`/auth`)
      kind: Rule
      services:
        - name: auth-service
          port: 80
    - match: PathPrefix(`/other-service/`)
      kind: Rule
      services:
        - name: other-service
          port: 80
      middlewares:
        - name: auth-middleware
          namespace: default
        - name: rewrite-path
          namespace: default